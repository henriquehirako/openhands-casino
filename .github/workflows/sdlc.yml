# Ticket lifecycle, two entry modes, every run green by construction.
#
#   timer / dispatch          : guard → janitor → coder ──dispatch──▶ pr.yml
#   dispatch with pr=N        : guard → merge → chain ──dispatch──▶ sdlc.yml (next ticket)
#
# pr.yml runs the review / fix loop and dispatches back here with pr=N once
# CI is green. Failures never fail a job: they become labels and comments.
# WIP is one: janitor picks nothing while an agent/ PR is open.
name: sdlc
run-name: "sdlc · ${{ inputs.pr != '' && format('merge PR #{0}', inputs.pr) || (inputs.issue != '' && format('#{0}', inputs.issue) || 'pick next') }} · depth ${{ inputs.depth || '0' }}"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement. Empty picks the oldest ready ticket."
        required: false
        default: ""
      pr:
        description: "PR number to merge. Set by pr.yml when reviews and CI are green."
        required: false
        default: ""
      depth:
        description: "Chain depth, set by the chain job."
        required: false
        default: "0"

concurrency:
  group: sdlc
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  DEPTH: ${{ inputs.depth || '0' }}
  MAX_DEPTH: "20"

jobs:
  guard:
    # Kill switch and chain bound.
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "$DEPTH" -ge "$MAX_DEPTH" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "depth $DEPTH reached MAX_DEPTH";
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  janitor:
    # Picks the oldest ready ticket, unless an agent PR is already in flight.
    # None ready: scans the repo, files one gap as a ticket born ready.
    needs: guard
    if: needs.guard.outputs.go == 'true' && inputs.pr == ''
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.pick.outputs.issue || steps.file.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: pick
        run: |
          OPEN=$(gh pr list --state open --json headRefName -q '[.[] | select(.headRefName | startswith("agent/"))] | length')
          if [ "$OPEN" != "0" ]; then
            echo "an agent PR is in flight, WIP is one, picking nothing" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "issue=" >> "$GITHUB_OUTPUT"; echo "wip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.issue }}" ]; then
            echo "issue=${{ inputs.issue }}" >> "$GITHUB_OUTPUT"
          else
            python agents/select_ticket.py | python -c 'import json,sys; print("issue=" + str(json.load(sys.stdin).get("number","")))' >> "$GITHUB_OUTPUT"
          fi
      - id: file
        if: steps.pick.outputs.issue == '' && steps.pick.outputs.wip != 'true'
        run: |
          python agents/janitor_scan.py --first > gap.json
          if [ "$(cat gap.json)" = "null" ] || [ ! -s gap.json ]; then echo "no gaps found" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python agents/run.py janitor --gap gap.json || echo "janitor could not file a ticket" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: board
        if: steps.pick.outputs.issue != '' || steps.file.outputs.issue != ''
        run: python .github/scripts/board.py "${{ steps.pick.outputs.issue || steps.file.outputs.issue }}" "In progress" || true

  coder:
    # Implements the ticket and opens the PR, then hands it to pr.yml.
    # Pushes with GH_PAT when set, so the PR fires real pull_request events
    # and ci.yml shows in the PR checks tab. GITHUB_TOKEN pushes fire nothing.
    needs: janitor
    if: needs.janitor.outputs.issue != ''
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.run.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: ./.github/actions/setup
      - id: run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: python agents/run.py coder --issue "${{ needs.janitor.outputs.issue }}" || echo "coder exited non-zero" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: hand off to pr workflow
        if: steps.run.outputs.pr != ''
        run: |
          gh issue edit "${{ needs.janitor.outputs.issue }}" --remove-label ready --add-label in-review || true
          python .github/scripts/board.py "${{ needs.janitor.outputs.issue }}" "In review" || true
          gh workflow run pr.yml -f pr="${{ steps.run.outputs.pr }}" -f issue="${{ needs.janitor.outputs.issue }}" -f round=0
          echo "PR #${{ steps.run.outputs.pr }} handed to pr.yml round 0" >> "$GITHUB_STEP_SUMMARY"
      - name: ticket needs a human
        if: steps.run.outputs.pr == ''
        run: |
          gh issue edit "${{ needs.janitor.outputs.issue }}" --remove-label ready --add-label needs-human || true
          gh issue comment "${{ needs.janitor.outputs.issue }}" --body "### sdlc: needs a human
          The coder finished without opening a PR. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  merge:
    # Entry mode pr=N: pr.yml reported reviews passed and CI green.
    needs: guard
    if: needs.guard.outputs.go == 'true' && inputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: merge
        env:
          # With GH_PAT the merge fires a real push event, which also wakes the watchdog.
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          PR="${{ inputs.pr }}"
          ISSUE="${{ inputs.issue }}"
          # Rebase merge keeps each coder-agent[bot] commit on main, a squash would
          # re-author them as github-actions[bot].
          if gh pr merge "$PR" --rebase --delete-branch; then
            echo "merged PR #$PR" >> "$GITHUB_STEP_SUMMARY"
            # Close the ticket by hand. The Closes #N link did not fire on a bot merge.
            [ -n "$ISSUE" ] && gh issue close "$ISSUE" --comment "Merged in PR #$PR by sdlc." || true
            [ -n "$ISSUE" ] && python .github/scripts/board.py "$ISSUE" "Done" || true
            # A GITHUB_TOKEN merge fires no push event, so wake the watchdog by hand in that case.
            [ -z "${{ secrets.GH_PAT }}" ] && gh workflow run watchdog.yml || true
          else
            echo "merge of PR #$PR failed, needs a human" >> "$GITHUB_STEP_SUMMARY"
            gh pr edit "$PR" --add-label needs-human || true
            [ -n "$ISSUE" ] && gh issue edit "$ISSUE" --add-label needs-human || true
            gh pr comment "$PR" --body "### sdlc: needs a human
          Reviews passed and CI was green, but the merge failed. Likely a conflict with main." || true
          fi

  chain:
    # Next ticket, only after a merge or after a coder that could not open a PR.
    needs: [guard, janitor, coder, merge]
    if: >-
      always() && needs.guard.outputs.go == 'true'
      && (needs.merge.result == 'success'
          || (needs.janitor.outputs.issue != '' && needs.coder.outputs.pr == ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          NEXT=$(python agents/select_ticket.py | python -c 'import json,sys; print(json.load(sys.stdin).get("number",""))')
          if [ -n "$NEXT" ]; then
            echo "next ticket #$NEXT, chaining at depth $((DEPTH + 1))" | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow run sdlc.yml -f issue="$NEXT" -f depth="$((DEPTH + 1))"
          else
            echo "no ready tickets, chain ends" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
