# Runs the test suite and a seeded simulation against main. Any failing
# invariant becomes a ticket born ready, deduped by fingerprint, and the
# sdlc workflow is dispatched to pick it up.
name: watchdog
run-name: "watchdog · ${{ github.event_name }}"

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

jobs:
  check:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
      - id: harness
        name: harness
        run: |
          if python agents/watchdog_check.py --rounds 2000 --seed 7 --out evidence.json; then
            echo "anomaly=false" >> "$GITHUB_OUTPUT"
          else
            echo "anomaly=true" >> "$GITHUB_OUTPUT"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat evidence.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - id: file
        name: file one ticket per broken invariant
        if: steps.harness.outputs.anomaly == 'true'
        # Each failing check gets its own evidence file and fingerprint, so one
        # bad merge that breaks two rules makes two tickets. A red test suite
        # alone is one ticket; with invariant failures it rides along as context.
        run: |
          python - <<'EOF'
          import hashlib, json
          e = json.load(open("evidence.json"))
          tests = [f for f in e["failures"] if f["check"] == "tests_failing"]
          checks = [f for f in e["failures"] if f["check"] != "tests_failing"] or tests
          for i, f in enumerate(checks):
              d = dict(e, failures=[f] + [t for t in tests if t is not f])
              d["fingerprint"] = hashlib.sha1(f["check"].encode()).hexdigest()[:12]
              json.dump(d, open(f"evidence-{i}.json", "w"), indent=2)
          print(f"{len(checks)} ticket(s) to file")
          EOF
          FIRST=""
          for f in evidence-*.json; do
            OUT=$(python agents/run.py watchdog --evidence "$f" 2>&1 || true)
            echo "$OUT" | tail -8
            echo "$OUT" | grep -q "duplicate of open ticket" && continue
            N=$(echo "$OUT" | grep -oE 'issues/[0-9]+' | tail -1 | cut -d/ -f2)
            [ -n "$N" ] && python .github/scripts/board.py "$N" "Ready" || true
            [ -z "$FIRST" ] && FIRST="$N"
          done
          echo "issue=$FIRST" >> "$GITHUB_OUTPUT"
      - name: dispatch sdlc for the first new ticket
        if: steps.file.outputs.issue != ''
        run: |
          gh workflow run sdlc.yml -f issue="${{ steps.file.outputs.issue }}" || true
          echo "dispatched sdlc for #${{ steps.file.outputs.issue }}, the chain picks up the rest" >> "$GITHUB_STEP_SUMMARY"
