name: setup
description: Python, pytest, gh and the Claude Code CLI for an agent job
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install -q pytest
    - shell: bash
      run: npm install -g --silent @anthropic-ai/claude-code@2.1.259
